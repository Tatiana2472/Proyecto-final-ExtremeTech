  <text x="112" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Cliente</text>
  <text x="112" y="459" text-anchor="middle" font-size="12" fill="#6b7889">(usuario registrado)</text>
  <g stroke="#111111" stroke-width="2.2" fill="none" stroke-linecap="round">
