<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" width="1160" height="800"
     role="img" aria-label="Diagrama de casos de uso del proceso de compra">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0EA5E9"/>
    </marker>
  </defs>
  <rect width="1160" height="800" fill="#ffffff"/>

  <text x="580" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">
    Diagrama de casos de uso &#8212; Proceso de compra
  </text>
  <text x="580" y="66" text-anchor="middle" font-size="13" fill="#6b7889">
    Tienda virtual Take Tech CR &#183; Tecnolog&#237;as y Sistemas Web II (ITI-523)
  </text>
  <rect x="236" y="96" width="636" height="668" rx="14"
        fill="#f7f9fc" stroke="#c9d3e0" stroke-width="2"/>
  <text x="554" y="122" text-anchor="middle"
        font-size="14" font-weight="700" fill="#111111">Sistema: Tienda virtual Take Tech CR</text>
  <ellipse cx="392" cy="152" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="157" text-anchor="middle" font-size="13" fill="#23303f">Registrarse / Iniciar sesión</text>
  <ellipse cx="392" cy="240" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="245" text-anchor="middle" font-size="13" fill="#23303f">Buscar y filtrar productos</text>
  <ellipse cx="392" cy="328" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="333" text-anchor="middle" font-size="13" fill="#23303f">Ver detalle del producto</text>
  <ellipse cx="392" cy="424" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="421" text-anchor="middle" font-size="13" fill="#23303f">Administrar el carrito</text>
  <text x="392" y="437" text-anchor="middle" font-size="13" fill="#23303f">(agregar, actualizar, eliminar)</text>
  <ellipse cx="392" cy="528" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="525" text-anchor="middle" font-size="13" fill="#23303f">Realizar el pago</text>
  <text x="392" y="541" text-anchor="middle" font-size="13" fill="#23303f">(proceso de compra)</text>
  <ellipse cx="392" cy="632" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="629" text-anchor="middle" font-size="13" fill="#23303f">Consultar historial</text>
  <text x="392" y="645" text-anchor="middle" font-size="13" fill="#23303f">de pedidos</text>
  <ellipse cx="392" cy="722" rx="142" ry="34" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="392" y="727" text-anchor="middle" font-size="13" fill="#23303f">Descargar factura en PDF</text>
  <ellipse cx="706" cy="300" rx="142" ry="34" fill="#eef8f8" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="706" y="297" text-anchor="middle" font-size="13" fill="#23303f">Registrar producto visto</text>
  <text x="706" y="313" text-anchor="middle" font-size="13" fill="#23303f">en la cookie</text>
  <ellipse cx="706" cy="400" rx="142" ry="34" fill="#eef8f8" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="706" y="397" text-anchor="middle" font-size="13" fill="#23303f">Calcular total:</text>
  <text x="706" y="413" text-anchor="middle" font-size="13" fill="#23303f">IVA 13% + envío</text>
  <ellipse cx="706" cy="500" rx="142" ry="34" fill="#eef8f8" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="706" y="497" text-anchor="middle" font-size="13" fill="#23303f">Procesar pago con</text>
  <text x="706" y="513" text-anchor="middle" font-size="13" fill="#23303f">la pasarela</text>
  <ellipse cx="706" cy="596" rx="142" ry="34" fill="#eef8f8" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="706" y="593" text-anchor="middle" font-size="13" fill="#23303f">Emitir factura y número</text>
  <text x="706" y="609" text-anchor="middle" font-size="13" fill="#23303f">de seguimiento</text>
  <ellipse cx="706" cy="712" rx="142" ry="34" fill="#fff6ec" stroke="#d98b3a" stroke-width="1.8"/>
  <text x="706" y="709" text-anchor="middle" font-size="13" fill="#23303f">Generar reportes</text>
  <text x="706" y="725" text-anchor="middle" font-size="13" fill="#23303f">de ventas en PDF</text>
  <g stroke="#111111" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="112" cy="336" r="14" fill="#fff"/>
    <line x1="112" y1="350" x2="112" y2="388"/>
    <line x1="90" y1="366" x2="134" y2="366"/>
    <line x1="112" y1="388" x2="94" y2="420"/>
    <line x1="112" y1="388" x2="130" y2="420"/>
