    <line x1="1046" y1="220" x2="1046" y2="258"/>
    <line x1="1024" y1="236" x2="1068" y2="236"/>
    <line x1="1046" y1="258" x2="1028" y2="290"/>
    <line x1="1046" y1="258" x2="1064" y2="290"/>
