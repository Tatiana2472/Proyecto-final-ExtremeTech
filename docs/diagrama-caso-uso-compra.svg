  <text x="1046" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Pasarela de pago</text>
  <text x="1046" y="329" text-anchor="middle" font-size="12" fill="#6b7889">Tarjeta / PayPal / SINPE</text>
  <g stroke="#111111" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="1046" cy="596" r="14" fill="#fff"/>
    <line x1="1046" y1="610" x2="1046" y2="648"/>
    <line x1="1024" y1="626" x2="1068" y2="626"/>
    <line x1="1046" y1="648" x2="1028" y2="680"/>
    <line x1="1046" y1="648" x2="1064" y2="680"/>
  </g>
  <text x="1046" y="702" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Administrador</text>
  <text x="1046" y="719" text-anchor="middle" font-size="12" fill="#6b7889">(es_admin)</text>
  <line x1="150" y1="380" x2="250" y2="152" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="240" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="328" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="424" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="528" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="632" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="150" y1="380" x2="250" y2="722" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="534" y1="328" x2="564" y2="300" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="549.0" y="306.0" text-anchor="middle" font-size="11" font-style="italic" fill="#0EA5E9">&#171;include&#187;</text>
  <line x1="534" y1="424" x2="564" y2="400" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="549.0" y="404.0" text-anchor="middle" font-size="11" font-style="italic" fill="#0EA5E9">&#171;include&#187;</text>
  <line x1="534" y1="518" x2="564" y2="422" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <line x1="534" y1="528" x2="564" y2="500" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="555.0" y="506.0" text-anchor="middle" font-size="11" font-style="italic" fill="#0EA5E9">&#171;include&#187;</text>
  <line x1="534" y1="540" x2="564" y2="582" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="543.0" y="581.0" text-anchor="middle" font-size="11" font-style="italic" fill="#0EA5E9">&#171;include&#187;</text>
  <line x1="534" y1="722" x2="576" y2="626" stroke="#0EA5E9" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="565.0" y="690.0" text-anchor="middle" font-size="11" font-style="italic" fill="#0EA5E9">&#171;extend&#187;</text>
  <line x1="848" y1="492" x2="1000" y2="300" stroke="#8a97a8" stroke-width="1.6"/>
  <line x1="1000" y1="660" x2="848" y2="712" stroke="#8a97a8" stroke-width="1.6"/>
  <g font-size="12" fill="#6b7889">
